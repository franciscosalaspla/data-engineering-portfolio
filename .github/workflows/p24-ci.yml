name: Project 24 CI

on:
  pull_request:
    paths:
      - "24-azure-banking-streaming-platform/**"
      - ".github/workflows/p24-ci.yml"
  push:
    branches:
      - main
    paths:
      - "24-azure-banking-streaming-platform/**"
      - ".github/workflows/p24-ci.yml"

permissions:
  contents: read

concurrency:
  group: p24-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python, Bicep, and repository quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BICEP_VERSION: "0.46.1"
      BICEP_LINUX_X64_SHA256: "3e011d629ea4311b7a7dd8f0040ab2b1a072ea4ff5d02cb75e0e55a9a6703fb9"
    defaults:
      run:
        working-directory: 24-azure-banking-streaming-platform

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: 24-azure-banking-streaming-platform/requirements-dev.txt

      - name: Install pinned quality dependencies
        run: python -m pip install --requirement requirements-dev.txt

      - name: Lint Python
        run: python -m ruff check src scripts tests

      - name: Check Python formatting
        run: python -m ruff format --check src scripts tests

      - name: Lint workflow YAML
        run: yamllint --config-file .yamllint.yml ../.github/workflows/p24-ci.yml

      - name: Install pinned Bicep CLI
        shell: bash
        run: |
          bicep_path="${RUNNER_TEMP}/bicep"
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            --output "${bicep_path}" \
            "https://github.com/Azure/bicep/releases/download/v${BICEP_VERSION}/bicep-linux-x64"
          printf '%s  %s\n' "${BICEP_LINUX_X64_SHA256}" "${bicep_path}" \
            | sha256sum --check --strict
          chmod +x "${bicep_path}"
          echo "BICEP_BIN=${bicep_path}" >> "${GITHUB_ENV}"

      - name: Lint and compile Bicep offline
        run: scripts/validate_bicep.sh

      - name: Run unit tests
        run: python -m pytest

      - name: Validate fixtures, links, and safety controls
        run: python scripts/validate_repository.py
