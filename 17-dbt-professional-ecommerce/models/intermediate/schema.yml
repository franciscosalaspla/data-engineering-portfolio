version: 2

models:
  - name: int_orders_enriched
    description: "Modelo intermedio que enriquece ordenes con clientes y productos para calcular metricas de negocio."
    columns:
      - name: order_id
        description: "Identificador unico de la orden enriquecida."
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "Identificador del cliente asociado a la orden."
        data_tests:
          - not_null
      - name: product_id
        description: "Identificador del producto vendido."
        data_tests:
          - not_null
      - name: normalized_order_status
        description: "Estado de orden validado para consumo analitico."
        data_tests:
          - not_null
          - accepted_values:
              values: ['completed', 'pending', 'cancelled', 'returned', 'unknown']
      - name: revenue
        description: "Ingreso bruto calculado como quantity * unit_price."
        data_tests:
          - not_null
      - name: cost
        description: "Costo calculado como quantity * unit_cost."
        data_tests:
          - not_null
      - name: margin
        description: "Margen calculado como revenue - cost."
        data_tests:
          - not_null

  - name: int_customer_order_history
    description: "Modelo intermedio con historial agregado de ordenes por cliente para alimentar dimensiones analiticas."
    columns:
      - name: customer_id
        description: "Identificador unico del cliente agregado."
        data_tests:
          - unique
          - not_null
      - name: total_orders
        description: "Cantidad total de ordenes historicas del cliente."
        data_tests:
          - not_null
      - name: completed_orders
        description: "Cantidad de ordenes completadas del cliente."
        data_tests:
          - not_null
      - name: completed_revenue
        description: "Revenue completado acumulado del cliente."
        data_tests:
          - not_null
