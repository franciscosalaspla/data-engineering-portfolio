version: 2

models:
  - name: fct_orders
    description: "Fact table incremental de ordenes de e-commerce lista para reporting y analisis financiero."
    columns:
      - name: order_id
        description: "Primary key de la fact table."
        data_tests:
          - unique
          - not_null
      - name: customer_id
        description: "Foreign key hacia dim_customers."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_id
      - name: product_id
        description: "Foreign key hacia dim_products."
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_id
      - name: order_date
        description: "Fecha de la orden."
        data_tests:
          - not_null
      - name: quantity
        description: "Cantidad vendida."
        data_tests:
          - not_null
      - name: unit_price
        description: "Precio unitario de venta."
        data_tests:
          - not_null
      - name: unit_cost
        description: "Costo unitario del producto."
        data_tests:
          - not_null
      - name: status
        description: "Estado normalizado de la orden."
        data_tests:
          - not_null
          - accepted_values:
              values: ['completed', 'pending', 'cancelled', 'returned', 'unknown']
      - name: revenue
        description: "Ingreso bruto de la orden."
        data_tests:
          - not_null
      - name: cost
        description: "Costo total asociado a la orden."
        data_tests:
          - not_null
      - name: margin
        description: "Margen de la orden."
        data_tests:
          - not_null
      - name: updated_at
        description: "Timestamp usado para carga incremental."
        data_tests:
          - not_null

  - name: dim_customers
    description: "Dimension final de clientes con atributos comerciales e historial agregado de compras."
    columns:
      - name: customer_id
        description: "Primary key del cliente."
        data_tests:
          - unique
          - not_null
      - name: customer_name
        description: "Nombre del cliente."
        data_tests:
          - not_null
      - name: email
        description: "Email del cliente."
        data_tests:
          - not_null
      - name: country
        description: "Pais del cliente."
        data_tests:
          - not_null
      - name: customer_segment
        description: "Segmento comercial del cliente."
        data_tests:
          - not_null
          - accepted_values:
              values: ['consumer', 'corporate', 'enterprise', 'small_business']
      - name: completed_revenue
        description: "Revenue historico completado del cliente."
        data_tests:
          - not_null

  - name: dim_products
    description: "Dimension final de productos para analisis por categoria y catalogo activo."
    columns:
      - name: product_id
        description: "Primary key del producto."
        data_tests:
          - unique
          - not_null
      - name: product_name
        description: "Nombre del producto."
        data_tests:
          - not_null
      - name: category
        description: "Categoria del producto."
        data_tests:
          - not_null
      - name: unit_cost
        description: "Costo unitario del producto."
        data_tests:
          - not_null
      - name: active_flag
        description: "Indicador booleano de producto activo."
        data_tests:
          - not_null
          - accepted_values:
              values: [true, false]
              quote: false
