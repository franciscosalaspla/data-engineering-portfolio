<style>
#azure-cloud-exact{color-scheme:light dark;}
#azure-cloud-exact *{box-sizing:border-box;}
#azure-cloud-exact .av-stage{--av-bg:light-dark(#fff,#141922);--av-ink:light-dark(#17263c,#edf2f9);--av-muted:light-dark(#536176,#b4c0d0);--av-line:light-dark(#dce4ee,#3b475a);--av-blue:light-dark(#245fc4,#a0c1ff);--av-blue-bg:light-dark(#eff5ff,#20304a);--av-bronze:light-dark(#fff3e5,#382c20);--av-silver:light-dark(#f0f3f7,#2b3340);--av-gold:light-dark(#fff8de,#3b351f);background:var(--av-bg);color:var(--av-ink);font:14px/1.4 system-ui,sans-serif;padding:23px 27px;min-height:615px;border:1px solid var(--av-line);border-radius:15px;}
#azure-cloud-exact header{margin-bottom:14px;}
#azure-cloud-exact .av-kicker{font-size:11px;color:var(--av-blue);font-weight:600;letter-spacing:1.5px;}
#azure-cloud-exact h2{font:600 25px/1.2 system-ui,sans-serif;margin:6px 0 0;}
#azure-cloud-exact strong{font-weight:600;}
#azure-cloud-exact small{display:block;font-size:11px;color:var(--av-muted);}
#azure-cloud-exact img{width:25px;height:25px;object-fit:contain;flex-shrink:0;}
#azure-cloud-exact .av-control{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:9px;background:var(--av-blue-bg);margin-bottom:12px;}
#azure-cloud-exact .av-control span{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
#azure-cloud-exact .av-control strong{font-size:13px;}
#azure-cloud-exact .av-timeline{position:relative;}
#azure-cloud-exact .av-timeline:before{content:"";position:absolute;left:20px;top:23px;bottom:26px;width:1px;background:var(--av-line);}
#azure-cloud-exact .av-item{display:flex;align-items:center;gap:13px;position:relative;min-height:60px;}
#azure-cloud-exact .av-spot{width:41px;height:41px;display:flex;align-items:center;justify-content:center;background:var(--av-bg);position:relative;flex-shrink:0;}
#azure-cloud-exact .av-spot>svg{width:22px;height:22px;color:var(--av-muted);}
#azure-cloud-exact .av-databricks{position:relative;background:var(--av-bg);padding:10px 12px;border:1px solid var(--av-line);border-radius:10px;}
#azure-cloud-exact .av-clean .av-databricks{margin:6px 0 6px 48px;}
#azure-cloud-exact .av-tech{display:flex;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap;}
#azure-cloud-exact .av-tech img{width:22px;height:22px;}
#azure-cloud-exact .av-tech strong{font-size:13px;}
#azure-cloud-exact .av-tech small{margin-left:auto;}
#azure-cloud-exact .av-layer{display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:6px;margin-top:5px;min-height:34px;}
#azure-cloud-exact .av-layer strong{font-size:12px;}
#azure-cloud-exact .av-layer small{margin-left:auto;text-align:right;}
#azure-cloud-exact .av-layer-dot{font-size:11px;color:var(--av-muted);width:14px;}
#azure-cloud-exact .av-bronze{background:var(--av-bronze);}
#azure-cloud-exact .av-silver{background:var(--av-silver);}
#azure-cloud-exact .av-gold{background:var(--av-gold);}
#azure-cloud-exact .av-q{display:flex;align-items:center;gap:5px;color:var(--av-muted);font-size:11px;margin:5px 0 0 21px;}
#azure-cloud-exact .av-q svg{width:13px;height:13px;flex-shrink:0;}
#azure-cloud-exact footer{display:flex;align-items:center;gap:9px;padding-top:13px;margin-top:12px;border-top:1px solid var(--av-line);font-size:11px;color:var(--av-muted);}
#azure-cloud-exact footer img{width:20px;height:20px;}
#azure-cloud-exact .av-block{display:flex;align-items:center;gap:12px;padding:7px 12px;border:1px solid var(--av-line);border-radius:8px;min-height:44px;background:var(--av-bg);}
#azure-cloud-exact .av-block>svg{width:25px;height:25px;color:var(--av-muted);flex-shrink:0;}
#azure-cloud-exact .av-block strong{font-size:13px;}
#azure-cloud-exact .av-arrow{display:flex;justify-content:center;padding:2px;color:var(--av-blue);}
#azure-cloud-exact .av-arrow svg{width:12px;height:12px;}
#azure-cloud-exact .av-output{display:grid;grid-template-columns:minmax(0,1fr) 21px minmax(0,1fr);gap:8px;align-items:center;}
#azure-cloud-exact .av-output>svg{width:19px;height:19px;color:var(--av-blue);}
#azure-cloud-exact .av-side-layout{display:grid;grid-template-columns:minmax(0,1fr) 123px;gap:23px;align-items:start;max-width:530px;margin:auto;}
#azure-cloud-exact .av-support{padding-top:147px;}
#azure-cloud-exact .av-support .av-control{flex-direction:column;align-items:center;text-align:center;padding:11px 8px;gap:5px;border-left:1px dashed var(--av-blue);}
#azure-cloud-exact .av-support .av-control>svg{width:17px;height:17px;color:var(--av-blue);}
#azure-cloud-exact .av-safe{display:flex;flex-direction:column;align-items:center;gap:5px;text-align:center;padding:13px 8px;margin-top:27px;border-top:1px solid var(--av-line);}
#azure-cloud-exact .av-safe strong{font-size:12px;}
#azure-cloud-exact .av-subtech{margin:-4px 0 9px;}
#azure-cloud-exact .av-stage{min-height:650px;}
#azure-cloud-exact .av-blocks .av-layer,#azure-cloud-exact .av-side .av-layer{min-height:29px;padding-top:6px;padding-bottom:6px;}
#azure-cloud-exact .av-blocks .av-block,#azure-cloud-exact .av-blocks .av-databricks,#azure-cloud-exact .av-blocks .av-output{max-width:470px;margin-left:auto;margin-right:auto;}

 #azure-cloud-exact .av-clean .av-databricks{margin-left:26px;}
 #azure-cloud-exact .av-tech small{margin-left:31px;width:100%;}
 #azure-cloud-exact .av-clean .av-layer{gap:7px;flex-wrap:wrap;}
 #azure-cloud-exact .av-clean .av-layer small{margin-left:auto;}
 #azure-cloud-exact .av-side-layout{grid-template-columns:minmax(0,1fr) 94px;gap:10px;}

 #azure-cloud-exact .av-side .av-layer{padding:7px;gap:5px;}
 #azure-cloud-exact .av-side .av-layer small{font-size:11px;}
 #azure-cloud-exact .av-side .av-q{margin-left:0;}
 #azure-cloud-exact .av-output{gap:5px;grid-template-columns:minmax(0,1fr) 16px minmax(0,1fr);}
 #azure-cloud-exact .av-output .av-block{padding:9px 7px;gap:7px;}
 #azure-cloud-exact .av-output img{width:23px;height:23px;}
}

#azure-cloud-exact .av-stage{min-height:0;}
#azure-cloud-exact .av-personal-header{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:12px;}
