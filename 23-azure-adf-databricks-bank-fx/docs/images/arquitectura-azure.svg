<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura del pipeline bancario en Azure</title>
<desc id="desc">Archivos CSV y JSON y API del Banco Central Europeo llegan a Landing en ADLS Gen2. Databricks conserva el origen en Bronze, valida en Silver y prepara el modelo y los montos en EUR en Gold. Silver separa registros inválidos en cuarentena. Gold se publica en Azure SQL para su análisis con Power BI. Data Factory coordina tres notebooks y Key Vault con Secret Scope protege las credenciales.</desc>
